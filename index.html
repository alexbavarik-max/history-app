<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="description" content="Исторический тренажёр по истории России и СССР 1941–2022">
    <meta name="color-scheme" content="light">
    <title>Исторический тренажёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .container {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 24px 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            max-height: 96vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .container::-webkit-scrollbar { width: 3px; }
        .container::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        
        .header {
            text-align: center;
            padding: 8px 0 16px 0;
            border-bottom: 2px solid rgba(0,0,0,0.06);
        }
        .header h1 { font-size: 24px; font-weight: 800; color: #1a1a2e; letter-spacing: -0.5px; }
        .header h1 span { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .subtitle { font-size: 13px; color: #888; margin-top: 4px; font-weight: 500; }
        
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 14px 10px;
            background: #f8f9fe;
            border-radius: 16px;
            margin: 14px 0;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .stat-item { text-align: center; flex: 1; }
        .stat-item .number { font-size: 22px; font-weight: 800; line-height: 1.2; }
        .stat-item .label { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .stat-item.correct .number { color: #2ecc71; }
        .stat-item.wrong .number { color: #e74c3c; }
        .stat-item.percent .number { color: #667eea; }
        
        .remaining {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin: -6px 0 14px 0;
            font-weight: 500;
        }
        .remaining span { color: #667eea; font-weight: 700; }
        
        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 6px 0 4px 0;
        }
        
        .menu-btn {
            padding: 15px 18px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            background: #f0f2f8;
            color: #333;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .menu-btn:active { transform: scale(0.97); }
        .menu-btn .icon { font-size: 20px; width: 28px; text-align: center; }
        .menu-btn .label { flex: 1; }
        .menu-btn .badge {
            font-size: 11px;
            background: rgba(0,0,0,0.06);
            padding: 2px 10px;
            border-radius: 20px;
            color: #666;
            font-weight: 600;
        }
        
        .menu-btn.primary { background: #eef2ff; color: #4f46e5; }
        .menu-btn.primary .badge { background: rgba(79,70,229,0.12); color: #4f46e5; }
        .menu-btn.success { background: #ecfdf5; color: #059669; }
        .menu-btn.success .badge { background: rgba(5,150,105,0.12); color: #059669; }
        .menu-btn.warning { background: #fffbeb; color: #d97706; }
        .menu-btn.warning .badge { background: rgba(217,119,6,0.12); color: #d97706; }
        .menu-btn.danger { background: #fef2f2; color: #dc2626; }
        .menu-btn.danger .badge { background: rgba(220,38,38,0.12); color: #dc2626; }
        .menu-btn.purple { background: #f5f3ff; color: #7c3aed; }
        .menu-btn.purple .badge { background: rgba(124,58,237,0.12); color: #7c3aed; }
        .menu-btn.secondary { background: #f1f5f9; color: #475569; }
        .menu-btn.secondary .badge { background: rgba(71,85,105,0.12); color: #475569; }
        
        .screen { display: none; animation: fadeIn 0.25s ease; }
        .screen.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .question-box {
            background: #f8f9fe;
            border-radius: 16px;
            padding: 20px 16px;
            margin: 12px 0;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .question-box .date { font-size: 30px; font-weight: 800; color: #333; letter-spacing: -0.5px; }
        .question-box .date .highlight { color: #4f46e5; }
        .question-box .event { font-size: 18px; font-weight: 600; color: #333; line-height: 1.5; }
        .question-box .sub { font-size: 13px; color: #888; margin-top: 6px; }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }
        
        .option-btn {
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 500;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn .num {
            display: inline-block;
            width: 26px;
            height: 26px;
            line-height: 26px;
            text-align: center;
            background: #f1f5f9;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            margin-right: 10px;
        }
        .option-btn.correct { border-color: #2ecc71; background: #ecfdf5; }
        .option-btn.correct .num { background: #2ecc71; color: white; }
        .option-btn.wrong { border-color: #e74c3c; background: #fef2f2; }
        .option-btn.wrong .num { background: #e74c3c; color: white; }
        .option-btn.show-correct { border-color: #2ecc71; background: #ecfdf5; }
        .option-btn.show-correct .num { background: #2ecc71; color: white; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }
        
        .result-box {
            padding: 16px;
            border-radius: 16px;
            margin: 12px 0;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .result-box.correct { background: #ecfdf5; border: 2px solid #2ecc71; }
        .result-box.wrong { background: #fef2f2; border: 2px solid #e74c3c; }
        .result-box .icon { font-size: 36px; }
        .result-box .text { font-size: 17px; font-weight: 700; margin-top: 4px; }
        .result-box .detail { font-size: 14px; color: #555; margin-top: 4px; }
        
        .next-btn {
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            transition: all 0.15s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .next-btn:active { transform: scale(0.97); }
        
        .back-btn {
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: all 0.15s ease;
        }
        .back-btn:active { transform: scale(0.97); }
        
        .mode-indicator {
            text-align: center;
            padding: 10px;
            background: #eef2ff;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #4f46e5;
            margin-bottom: 12px;
        }
        
        .sub-hint {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin: 10px 0 4px 0;
            font-weight: 500;
        }
        
        .all-dates {
            max-height: 320px;
            overflow-y: auto;
            margin: 12px 0;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
        }
        .all-dates::-webkit-scrollbar { width: 3px; }
        .all-dates::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
        
        .date-item {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .date-item:last-child { border-bottom: none; }
        .date-item .year {
            color: #4f46e5;
            font-weight: 700;
            white-space: nowrap;
            background: #eef2ff;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 13px;
        }
        .date-item .text { color: #7c3aed; line-height: 1.4; }
        
        .install-banner {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 16px;
            border-radius: 14px;
            margin-top: 14px;
            display: none;
            align-items: center;
            justify-content: space-between;
            animation: slideUp 0.5s ease;
        }
        .install-banner.show { display: flex; }
        .install-banner .text { font-size: 14px; flex: 1; font-weight: 500; }
        .install-banner .btn-install {
            background: white;
            color: #764ba2;
            border: none;
            padding: 8px 22px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 400px) {
            .container { padding: 16px 14px; border-radius: 20px; }
            .header h1 { font-size: 20px; }
            .question-box .date { font-size: 26px; }
            .option-btn { padding: 12px 14px; font-size: 14px; }
            .stats .number { font-size: 19px; }
            .menu-btn { padding: 13px 14px; font-size: 15px; }
        }

        button:focus-visible {
            outline: 3px solid rgba(124, 58, 237, 0.35);
            outline-offset: 2px;
        }

        .option-btn .option-text {
            vertical-align: middle;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    
        /* FINAL: одинаковый стиль только двух экранов */
        #dateScreen .header h1,
        #eventScreen .header h1,
        #dateScreen .question-box .date,
        #eventScreen .question-box .event,
        #dateScreen .remaining span,
        #eventScreen .remaining span {
            color: #7c3aed;
        }

        #dateScreen .menu-btn,
        #eventScreen .menu-btn,
        #dateScreen .back-btn,
        #eventScreen .back-btn {
            background: #f8f9fc;
            color: #7c3aed;
            border: 1px solid #e5e7eb;
            font-weight: 550;
        }

        #dateScreen .menu-btn .badge,
        #eventScreen .menu-btn .badge {
            background: #eef0f5;
            color: #7c3aed;
        }

        #dateScreen .question-box,
        #eventScreen .question-box {
            background: #f8f9fc;
            border-color: #e5e7eb;
        }

        #dateScreen .question-box .date {
            font-weight: 800;
        }

        #eventScreen .question-box .event {
            font-weight: 650;
        }

        #dateScreen .option-btn,
        #eventScreen .option-btn {
            font-weight: 600;
        }

    </style>

<style id="agreed-tabs-style">
/* ===== СОГЛАСОВАННЫЙ СТИЛЬ: Случайная дата + Случайное событие ===== */
/* Одинаковая структура, размеры, отступы и визуальная иерархия.
   Фиолетовый — только акцент, кнопки нейтральные. */

#dateScreen .header h1,
#eventScreen .header h1 {
    color: #7c3aed !important;
}

#dateScreen .remaining span,
#eventScreen .remaining span {
    color: #7c3aed !important;
    font-weight: 600;
}

/* Карточка вопроса */
#dateScreen .question-box,
#eventScreen .question-box {
    background: #fff !important;
    border: 1px solid #e5e7eb !important;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06) !important;
}

/* Главный текст */
#dateScreen .question-box .date,
#eventScreen .question-box .event {
    color: #7c3aed !important;
}

#dateScreen .question-box .date {
    font-weight: 800 !important;
}

#eventScreen .question-box .event {
    font-weight: 700 !important;
}

/* Кнопки — без фиолетового фона и без фиолетовой рамки */
#dateScreen .menu-btn,
#eventScreen .menu-btn,
#dateScreen .back-btn,
#eventScreen .back-btn {
    background: #f8f9fc !important;
    color: #7c3aed !important;
    border: 1px solid #e5e7eb !important;
    box-shadow: none !important;
    font-weight: 600 !important;
}

#dateScreen .menu-btn:hover,
#eventScreen .menu-btn:hover,
#dateScreen .back-btn:hover,
#eventScreen .back-btn:hover {
    background: #f3f4f8 !important;
    border-color: #dfe2e8 !important;
}

#dateScreen .menu-btn .badge,
#eventScreen .menu-btn .badge {
    background: #eef0f5 !important;
    color: #7c3aed !important;
}

/* Варианты ответа — одинаковые на обоих экранах */
#dateScreen .option-btn,
#eventScreen .option-btn {
    color: #333 !important;
    background: #fff !important;
    border: 2px solid #e5e7eb !important;
    font-weight: 600 !important;
}

#dateScreen .option-btn:hover:not(.disabled),
#eventScreen .option-btn:hover:not(.disabled) {
    border-color: #cfc7e8 !important;
    background: #faf9fd !important;
}

#dateScreen .option-btn .num,
#eventScreen .option-btn .num {
    color: #7c3aed !important;
    font-weight: 700 !important;
}

/* Служебные подписи чуть плотнее, но не bold */
#dateScreen .question-box,
#eventScreen .question-box,
#dateScreen .result-box,
#eventScreen .result-box {
    font-weight: 550;
}

/* Фокус клавиатуры нейтральный, без фиолетовой рамки */
#dateScreen button:focus-visible,
#eventScreen button:focus-visible {
    outline: 2px solid #d1d5db !important;
    outline-offset: 2px;
}
</style>


<style id="unified-quiz-style">
/* ===== ЕДИНЫЙ СТИЛЬ ВСЕХ ЧЕТЫРЁХ РЕЖИМОВ ===== */
/* Акцент везде один: #7c3aed. Нейтральные кнопки без фиолетовой заливки. */

#dateScreen .header h1,
#eventScreen .header h1,
#dateQuizScreen .header h1,
#eventQuizScreen .header h1,
#dateScreen .remaining span,
#eventScreen .remaining span,
#dateQuizScreen .remaining span,
#eventQuizScreen .remaining span {
    color: #7c3aed !important;
}

#dateScreen .menu-btn,
#eventScreen .menu-btn,
#dateQuizScreen .menu-btn,
#eventQuizScreen .menu-btn,
#dateScreen .back-btn,
#eventScreen .back-btn,
#dateQuizScreen .back-btn,
#eventQuizScreen .back-btn {
    background: #f8f9fc !important;
    color: #7c3aed !important;
    border: 1px solid #e5e7eb !important;
    box-shadow: none !important;
    font-weight: 600 !important;
}

#dateScreen .menu-btn .badge,
#eventScreen .menu-btn .badge,
#dateQuizScreen .menu-btn .badge,
#eventQuizScreen .menu-btn .badge {
    background: #eef0f5 !important;
    color: #7c3aed !important;
}

#dateScreen .question-box,
#eventScreen .question-box,
#dateQuizScreen .question-box,
#eventQuizScreen .question-box {
    background: #f8f9fc !important;
    border: 1px solid #e5e7eb !important;
    box-shadow: none !important;
}

#dateScreen .question-box .date,
#eventScreen .question-box .event,
#dateQuizScreen .question-box .date,
#eventQuizScreen .question-box .event {
    color: #7c3aed !important;
}

#dateScreen .question-box .date,
#eventQuizScreen .question-box .date {
    font-weight: 800 !important;
}

#eventScreen .question-box .event,
#dateQuizScreen .question-box .event {
    font-weight: 700 !important;
}

/* Варианты ответов тоже одинаковые */
#dateQuizScreen .option-btn,
#eventQuizScreen .option-btn {
    background: #fff !important;
    color: #333 !important;
    border: 2px solid #e5e7eb !important;
    font-weight: 600 !important;
}

#dateQuizScreen .option-btn:hover:not(.disabled),
#eventQuizScreen .option-btn:hover:not(.disabled) {
    background: #faf9fd !important;
    border-color: #d9d4e6 !important;
}

#dateQuizScreen .option-btn .num,
#eventQuizScreen .option-btn .num {
    color: #7c3aed !important;
    font-weight: 700 !important;
}

#dateQuizScreen .question-title,
#eventQuizScreen .question-title,
#dateQuizScreen .result-box,
#eventQuizScreen .result-box {
    font-weight: 550;
}

/* Фокус не создаёт фиолетовую рамку */
#dateQuizScreen button:focus-visible,
#eventQuizScreen button:focus-visible,
#dateScreen button:focus-visible,
#eventScreen button:focus-visible {
    outline: 2px solid #d1d5db !important;
    outline-offset: 2px;
}
</style>

</head>
<body>
    <div class="container" id="app">
        <div class="install-banner" id="installBanner">
            <span class="text">📱 Установить приложение</span>
            <button class="btn-install" id="installBtn">Установить</button>
        </div>
        
        <div class="screen active" id="menuScreen">
            <div class="header">
                <h1>📚 <span>Исторический тренажёр</span></h1>
                <div class="subtitle">Россия и СССР • 1941–2022</div>
            </div>
            
            <div class="stats">
                <div class="stat-item correct"><div class="number" id="correctCount">0</div><div class="label">✅ Верно</div></div>
                <div class="stat-item wrong"><div class="number" id="wrongCount">0</div><div class="label">❌ Ошибок</div></div>
                <div class="stat-item percent"><div class="number" id="percentCount">0%</div><div class="label">📈 Рейтинг</div></div>
            </div>
            
            <div class="remaining">📊 Осталось: <span id="remainingCount">0</span> дат</div>
            
            <div class="menu">
                <button class="menu-btn primary" onclick="playClick(); showRandomDate();"><span class="icon">🎲</span><span class="label">Случайная дата</span></button>
                <button class="menu-btn purple" onclick="playClick(); showRandomEvent();"><span class="icon">📝</span><span class="label">Случайное событие</span></button>
                <button class="menu-btn success" onclick="playClick(); showFullAnswer();"><span class="icon">📖</span><span class="label">Полный ответ</span></button>
                <button class="menu-btn warning" onclick="playClick(); startQuiz('date-to-event');"><span class="icon">❓</span><span class="label">Дата → Событие</span></button>
                <button class="menu-btn danger" onclick="playClick(); startQuiz('event-to-date');"><span class="icon">❓</span><span class="label">Событие → Дата</span></button>
                <button class="menu-btn secondary" onclick="playClick(); showAllDates();"><span class="icon">📋</span><span class="label">Все даты</span><span class="badge" id="allDatesBadge">0</span></button>
                <button class="menu-btn secondary" onclick="playClick(); resetAll();"><span class="icon">🔄</span><span class="label">Сбросить всё</span></button>
                <button class="menu-btn secondary" id="musicToggleBtn" onclick="toggleMusic();"><span class="icon">🔊</span><span class="label">Музыка: Вкл</span></button>
            </div>
        </div>
        
        <div class="screen" id="quizScreen">
            <div class="mode-indicator" id="quizMode">❓ Викторина</div>
            <div class="question-box" id="questionBox"><div class="date" id="questionDate">1945</div></div>
            <div class="options" id="optionsContainer"></div>
            <div id="resultContainer"></div>
            <button class="next-btn hidden" id="nextQuizBtn" onclick="playClick(); nextQuizQuestion();">➡ Дальше</button>
            <div class="sub-hint" id="quizHint">⬆ Выберите вариант</div>
            <button class="back-btn" onclick="playClick(); goToMenu();">⬅ В меню</button>
        </div>
        
        <div class="screen" id="allDatesScreen">
            <div class="header"><h1>📋 Все даты</h1></div>
            <div class="all-dates" id="allDatesList"></div>
            <div class="remaining" id="allDatesRemaining"></div>
            <button class="back-btn" onclick="playClick(); goToMenu();">⬅ В меню</button>
        </div>
        
        <div class="screen" id="dateScreen">
            <div class="header"><h1 id="dateScreenTitle">🎯 Случайная дата</h1></div>
            <div class="question-box"><div class="date" id="displayDate">1945</div></div>
            <div class="remaining" id="dateRemaining">Осталось: 0</div>
            <div class="menu">

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playSynthTone(frequency, duration, type = 'sine', volume = 0.3) {
            if (!isSoundEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                const now = ctx.currentTime;

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, now);
                gainNode.gain.setValueAtTime(Math.max(0.001, volume), now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.start(now);
                oscillator.stop(now + duration);
            } catch (e) {
                // Звук не должен ломать работу приложения.
            }
        }

            if (!isSoundEnabled) return;

        function sliceDate(text) {
            let match = text.match(/\b([А-Яа-я]+\s+)?\d{4}\b/);
            if (match) {
                let idx = text.indexOf(match[0]);
                let endIdx = idx + match[0].length;
                let rest = text.substring(endIdx);
                let rangeMatch = rest.match(/^\s*[-–—]\s*\d{4}/);
                if (rangeMatch) {
                    endIdx += rangeMatch[0].length;
                }
                return text.substring(0, endIdx).trim();
            }
            return text;
        }

        function isPeriod(text) {
            return /[-–—]\s*\d{4}/.test(text);
        }

        function isPeriodLine(text) {
            return /[-–—]\s*\d{4}/.test(text);
        }

        function extractYear(text) {
            let match = text.match(/\b(\d{4})\b/);
            if (match) return parseInt(match[0]);
            return null;
        }

        function extractEvent(text) {
            let datePart = sliceDate(text);
            if (datePart) {
                let event = text.substring(datePart.length).trim();
                event = event.replace(/^[-–—\s]+/, '');
                event = event.replace(/^\d{4}\s*[-–—]?\s*/, '');
                event = event.replace(/^[А-Яа-я]+\s+\d{4}\s*[-–—]?\s*/, '');
                if (event) return event;
            }
            return text;
        }

            }
            return arr;

                let ya = extractYear(a) || 0;
                let yb = extractYear(b) || 0;
                return ya - yb;
            });
            if (sorted.length === 0) {
                list.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">📭 Все даты изучены!</div>';
            } else {
                sorted.forEach(d => {
                    let div = document.createElement('div');
                    div.className = 'date-item';
                    div.innerHTML = `<span class="year">${sliceDate(d)}</span><span class="text">${d.substring(sliceDate(d).length).trim().replace(/^[-–—\s]+/, '')}</span>`;
                    list.appendChild(div);
                });
            }
            document.getElementById('allDatesRemaining').textContent = '📊 Всего: ' + sorted.length + ' дат';
            showScreen('allDatesScreen');
        }

        function resetAll() {
            dates = [...originalDates];
            correct = 0;
            incorrect = 0;
            lastDate = null;
            lastEvent = null;
            lastMode = null;
            isQuizMode = false;
            usedDatesForQuiz = [];
            document.getElementById('nextQuizBtn').classList.add('hidden');
            document.getElementById('quizHint').classList.remove('hidden');
            updateStats();
            alert('✅ Сброшено! Загружено ' + dates.length + ' дат');
            goToMenu();
        }

        // ============================================================
        // ===== ВИКТОРИНА (ИСПРАВЛЕННАЯ) =====
        // ============================================================
        function startQuiz(type) {
            isQuizMode = true;
            usedDatesForQuiz = [];
            currentQuizType = type;
            document.getElementById('nextQuizBtn').classList.add('hidden');
            document.getElementById('quizHint').classList.remove('hidden');
            if (dates.length < 4) {
                alert('Недостаточно дат для викторины (нужно минимум 4)');
                return;
            }
            document.getElementById('quizMode').textContent = type === 'date-to-event' ? 
                '❓ Викторина: ДАТА → СОБЫТИЕ' : 
                '❓ Викторина: СОБЫТИЕ → ДАТА';
            showQuizQuestion(type);
            showScreen('quizScreen');
        }

        function showQuizQuestion(type) {
            let available = dates.filter(d => !usedDatesForQuiz.includes(d));
            if (available.length < 4) {
                usedDatesForQuiz = [];
                available = dates.filter(d => !usedDatesForQuiz.includes(d));
                if (available.length < 4) {
                    document.getElementById('questionBox').innerHTML = '<div class="date">🎉 Все даты изучены!</div>';
                    document.getElementById('optionsContainer').innerHTML = '';
                    document.getElementById('resultContainer').innerHTML = '';
                    document.getElementById('nextQuizBtn').classList.add('hidden');
                    document.getElementById('quizHint').classList.remove('hidden');
                    return;
                }
            }

            let correctDate = available[Math.floor(Math.random() * available.length)];
            usedDatesForQuiz.push(correctDate);

            let datePart = sliceDate(correctDate);
            let correctEvent = extractEvent(correctDate);
            let correctYear = extractYear(correctDate);
            let correctIsPeriod = isPeriod(datePart);

            if (!correctEvent || correctYear === null) {
                showQuizQuestion(type);
                return;
            }

            let options = [];
            let otherDates = dates.filter(d => d !== correctDate && !usedDatesForQuiz.includes(d));
            shuffleArray(otherDates);

            if (type === 'date-to-event') {
                // Дата → Событие: варианты — ТОЛЬКО СОБЫТИЯ (БЕЗ ПЕРИОДОВ)
                document.getElementById('questionBox').innerHTML = `<div class="date">📅 ${datePart}</div>`;
                options = [correctEvent];
                
                let nearby = [];
                for (let d of otherDates) {
                    let y = extractYear(d);
                    let e = extractEvent(d);
                    const periodLine = isPeriodLine(d);
                    if (y !== null && e && Math.abs(y - correctYear) <= 5 && e !== correctEvent && !periodLine) {
                        nearby.push(e);
                    }
                }
                if (nearby.length >= 3) {
                    shuffleArray(nearby);
                    options.push(...nearby.slice(0, 3));
                } else {
                    for (let d of otherDates) {
                        const e = extractEvent(d);
                        const periodLine = isPeriodLine(d);
                        if (e && e !== correctEvent && !periodLine && !options.includes(e)) {
                            options.push(e);
                            if (options.length >= 4) break;
                        }
                    }
                }
                let fakeIndex = 1;
                while (options.length < 4) {
                    const fake = 'Фиктивное событие ' + (correctYear + fakeIndex++);
                    if (!options.includes(fake)) options.push(fake);
                }
            } else {
                // Событие → Дата: варианты — ТОЛЬКО ДАТЫ/ПЕРИОДЫ
                document.getElementById('questionBox').innerHTML = `<div class="event">📖 ${correctEvent}</div>`;
                options = [datePart];
                
                let nearby = [];
                for (let d of otherDates) {
                    let y = extractYear(d);
                    let dDate = sliceDate(d);
                    let isPeriodCandidate = isPeriod(dDate);
                    if (y !== null && Math.abs(y - correctYear) <= 5 && isPeriodCandidate === correctIsPeriod) {
                        nearby.push(dDate);
                    }
                }
                if (nearby.length >= 3) {
                    shuffleArray(nearby);
                    options.push(...nearby.slice(0, 3));
                } else {
                    for (let d of otherDates.slice(0, 3)) {
                        let s = sliceDate(d);
                        let isPeriodCandidate = isPeriod(s);
                        if (s !== datePart && isPeriodCandidate === correctIsPeriod) {
                            options.push(s);
                        }
                    }
                }
                while (options.length < 4) {
                    let fake;
                    if (correctIsPeriod) {
                        let start = correctYear + Math.floor(Math.random() * 6 - 3);
                        let end = start + Math.floor(Math.random() * 4 + 1);
                        fake = start + '-' + end;
                    } else {
                        fake = String(correctYear + Math.floor(Math.random() * 10 - 5));
                    }
                    if (fake !== datePart) options.push(fake);
                }
            }

            let uniqueOptions = [...new Set(options)];
            while (uniqueOptions.length < 4) {
                let extraFake;
                if (type === 'date-to-event') {
                    extraFake = 'Фиктивное событие ' + (correctYear + Math.floor(Math.random() * 10 - 5));
                } else {
                    if (correctIsPeriod) {
                        let start = correctYear + Math.floor(Math.random() * 6 - 3);
                        let end = start + Math.floor(Math.random() * 4 + 1);
                        extraFake = start + '-' + end;
                    } else {
                        extraFake = String(correctYear + Math.floor(Math.random() * 10 - 5));
                    }
                }
                if (!uniqueOptions.includes(extraFake) && extraFake !== datePart) {
                    uniqueOptions.push(extraFake);
                }
            }

            shuffleArray(uniqueOptions);

            let container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            uniqueOptions.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-btn';
                btn.dataset.value = opt;
                btn.setAttribute('aria-label', `Вариант ${i + 1}: ${opt}`);
                btn.innerHTML = `<span class="num">${i + 1}</span><span class="option-text"></span>`;
                btn.querySelector('.option-text').textContent = opt;
                btn.onclick = () => {
                    playClick();
                    checkAnswer(opt, correctDate, type, uniqueOptions);
                };
                container.appendChild(btn);
            });

            document.getElementById('resultContainer').innerHTML = '';
            document.getElementById('nextQuizBtn').classList.add('hidden');
            document.getElementById('quizHint').classList.remove('hidden');
            
            nextQuestionData = { type, correctDate };
        }

        function checkAnswer(selected, correctDate, type, options) {
            let datePart = sliceDate(correctDate);
            let correctEvent = extractEvent(correctDate);
            let isCorrect = false;

            if (type === 'date-to-event') {
                isCorrect = (selected === correctEvent);
            } else {
                isCorrect = (selected === datePart);
            }

            let container = document.getElementById('resultContainer');
            let btns = document.querySelectorAll('.option-btn');
            
            btns.forEach(btn => btn.classList.add('disabled'));
            
            btns.forEach((btn) => {
                const value = btn.dataset.value || '';
                const correctValue = type === 'date-to-event' ? correctEvent : datePart;

                if (value === correctValue) {
                    btn.classList.add('show-correct');
                }
                if (value === selected && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            if (isCorrect) {
                correct++;
                playCorrectSound();
                container.innerHTML = `
                    <div class="result-box correct">
                        <div class="icon">✅</div>
                        <div class="text">ПРАВИЛЬНО!</div>
                        <div class="detail">${correctDate}</div>
                    </div>
                `;
            } else {
                incorrect++;
                playWrongSound();
                container.innerHTML = `
                    <div class="result-box wrong">
                        <div class="icon">❌</div>
                        <div class="text">НЕПРАВИЛЬНО!</div>
                        <div class="detail">✅ Правильный ответ: ${correctDate}</div>
                    </div>
                `;
            }

            updateStats();
            
            document.getElementById('nextQuizBtn').classList.remove('hidden');
            document.getElementById('quizHint').classList.add('hidden');
        }

        function nextQuizQuestion() {
            document.getElementById('nextQuizBtn').classList.add('hidden');
            document.getElementById('quizHint').classList.remove('hidden');
            showQuizQuestion(currentQuizType);
        }

        // ============================================================
        // ===== ИНИЦИАЛИЗАЦИЯ =====
        // ============================================================
        updateStats();
    </script>
</body>
</html>
