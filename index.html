<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Исторический тренажёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-height: 95vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* ... остальные стили такие же, как в предыдущей версии ... */
        /* (я сократил для экономии места, но полный код пришлю) */
        
        .install-banner {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 12px;
            display: none;
            align-items: center;
            justify-content: space-between;
            animation: slideUp 0.5s ease;
        }
        
        .install-banner.show {
            display: flex;
        }
        
        .install-banner .text {
            font-size: 14px;
            flex: 1;
        }
        
        .install-banner .btn-install {
            background: white;
            color: #764ba2;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 400px) {
            .container { padding: 14px; }
            .header h1 { font-size: 18px; }
            .question-box .date { font-size: 24px; }
            .option-btn { padding: 12px; font-size: 14px; }
        }
        
        /* Стили для скролла */
        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
    </style>
</head>
<body>

        // ===== УСТАНОВКА ПРИЛОЖЕНИЯ =====
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.add('show');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    document.getElementById('installBanner').classList.remove('show');
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            document.getElementById('installBanner').classList.remove('show');
        });

        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====

        function sliceDate(text) {
            let match = text.match(/\d{4}/);
            if (match) {
                let idx = text.indexOf(match[0]);
                return text.substring(0, idx + 4);
            }
            return text;
        }

        function extractYear(text) {
            let match = text.match(/\d{4}/);
            if (match) return parseInt(match[0]);
            return null;
        }

        function extractEvent(text) {
            let datePart = sliceDate(text);
            if (datePart) {
                let event = text.substring(datePart.length).trim();
                event = event.replace(/^[-–—\s]+/, '');
                if (event) return event;
            }
            return text;
        }

        function updateStats() {
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = incorrect;
            let total = correct + incorrect;
            let percent = total === 0 ? '0%' : Math.round((correct / total) * 100) + '%';
            document.getElementById('percentCount').textContent = percent;
            document.getElementById('remainingCount').textContent = dates.length;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            updateStats();
        }

        function goToMenu() {
            isQuizMode = false;
            showScreen('menuScreen');
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

            dates = dates.filter(d => d !== selected);
            lastDate = selected;
            
            document.getElementById('displayDate').textContent = sliceDate(selected);
            document.getElementById('dateRemaining').textContent = 'Осталось: ' + dates.length;
            document.getElementById('dateScreenTitle').textContent = '🎯 Случайная дата';
            showScreen('dateScreen');
        }

        function showFullAnswer() {
            if (!lastDate) {
                alert('Сначала выберите дату (нажмите "Случайная дата")');
                return;
            }
            document.getElementById('displayDate').innerHTML = sliceDate(lastDate) + '<br><span style="font-size:16px;color:#555;">' + lastDate + '</span>';
            document.getElementById('dateRemaining').textContent = 'Осталось: ' + dates.length;
            document.getElementById('dateScreenTitle').textContent = '📖 Полный ответ';
            showScreen('dateScreen');
        }

        function showAllDates() {
            let list = document.getElementById('allDatesList');
            list.innerHTML = '';
            let sorted = [...dates].sort((a, b) => {
                let ya = extractYear(a) || 0;
                let yb = extractYear(b) || 0;
                return ya - yb;
            });
            sorted.forEach(d => {
                let div = document.createElement('div');
                div.className = 'date-item';
                div.innerHTML = `<span class="year">${sliceDate(d)}</span> | ${d}`;
                list.appendChild(div);
            });
            showScreen('allDatesScreen');
        }

        function resetAll() {
            dates = [...originalDates];
            correct = 0;
            incorrect = 0;
            lastDate = null;
            isQuizMode = false;
            updateStats();
            alert('✅ Сброшено! Загружено ' + dates.length + ' дат');
            goToMenu();
        }

        // ===== ВИКТОРИНА =====

        function startQuiz(type) {
            isQuizMode = true;
            if (dates.length < 4) {
                alert('Недостаточно дат для викторины (нужно минимум 4)');
                return;
            }
            document.getElementById('quizMode').textContent = type === 'date-to-event' ? 
                '❓ Викторина: ДАТА → СОБЫТИЕ' : 
                '❓ Викторина: СОБЫТИЕ → ДАТА';
            showQuizQuestion(type);
            showScreen('quizScreen');
        }

        function showQuizQuestion(type) {
            if (dates.length < 4) {
                document.getElementById('questionBox').innerHTML = '<div class="date">🎉 Все даты изучены!</div>';
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('resultContainer').innerHTML = '';
                return;
            }

            let correctDate = dates[Math.floor(Math.random() * dates.length)];
            dates = dates.filter(d => d !== correctDate);
            lastDate = correctDate;

            let datePart = sliceDate(correctDate);
            let correctEvent = extractEvent(correctDate);
            let correctYear = extractYear(correctDate);

            if (!correctEvent || correctYear === null) {
                showQuizQuestion(type);
                return;
            }

            let options = [];
            let otherDates = [...dates];
            shuffleArray(otherDates);

            if (type === 'date-to-event') {
                document.getElementById('questionBox').innerHTML = `<div class="date">📅 ${datePart}</div>`;
                options = [correctEvent];
                
                let nearby = [];
                for (let d of otherDates) {
                    let y = extractYear(d);
                    let e = extractEvent(d);
                    if (y !== null && e && Math.abs(y - correctYear) <= 5 && e !== correctEvent) {
                        nearby.push(e);
                    }
                }
                if (nearby.length >= 3) {
                    shuffleArray(nearby);
                    options.push(...nearby.slice(0, 3));
                } else {
                    for (let d of otherDates.slice(0, 3)) {
                        let e = extractEvent(d);
                        if (e && e !== correctEvent) options.push(e);
                    }
                }
                while (options.length < 4) {
                    options.push('Фиктивное событие ' + (correctYear + Math.floor(Math.random() * 10 - 5)));
                }
            } else {
                document.getElementById('questionBox').innerHTML = `<div class="event">📖 ${correctEvent}</div>`;
                options = [datePart];
                
                let nearby = [];
                for (let d of otherDates) {
                    let y = extractYear(d);
                    if (y !== null && Math.abs(y - correctYear) <= 5) {
                        nearby.push(sliceDate(d));
                    }
                }
                if (nearby.length >= 3) {
                    shuffleArray(nearby);
                    options.push(...nearby.slice(0, 3));
                } else {
                    for (let d of otherDates.slice(0, 3)) {
                        let s = sliceDate(d);
                        if (s !== datePart) options.push(s);
                    }
                }
                while (options.length < 4) {
                    let fake = correctYear + Math.floor(Math.random() * 10 - 5);
                    if (fake !== correctYear) options.push(String(fake));
                }
            }

            shuffleArray(options);

            let container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            options.forEach((opt, i) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = (i + 1) + '. ' + opt;
                btn.onclick = () => checkAnswer(opt, correctDate, type, options);
                container.appendChild(btn);
            });

            document.getElementById('resultContainer').innerHTML = '';
        }

        function checkAnswer(selected, correctDate, type, options) {
            let datePart = sliceDate(correctDate);
            let correctEvent = extractEvent(correctDate);
            let isCorrect = false;

            if (type === 'date-to-event') {
                isCorrect = (selected === correctEvent);
            } else {
                isCorrect = (selected === datePart);
            }

            let container = document.getElementById('resultContainer');
            let btns = document.querySelectorAll('.option-btn');
            
            // Блокируем кнопки
            btns.forEach(btn => btn.style.pointerEvents = 'none');
            
            // Показываем правильный ответ
            btns.forEach((btn, i) => {
                let text = btn.textContent.substring(3);
                if (type === 'date-to-event') {
                    if (text === correctEvent) btn.classList.add('show-correct');
                } else {
                    if (text === datePart) btn.classList.add('show-correct');
                }
                // Отмечаем выбранный вариант
                if (btn.textContent === (i+1) + '. ' + selected) {
                    if (!isCorrect) btn.classList.add('wrong');
                }
            });

            if (isCorrect) {
                correct++;
                container.innerHTML = `
                    <div class="result-box correct">
                        <div class="icon">✅</div>
                        <div class="text">ПРАВИЛЬНО! Молодец!</div>
                        <div class="detail">${correctDate}</div>
                    </div>
                `;
            } else {
                incorrect++;
                container.innerHTML = `
                    <div class="result-box wrong">
                        <div class="icon">❌</div>
                        <div class="text">НЕПРАВИЛЬНО!</div>
                        <div class="detail">✅ Правильный ответ: ${correctDate}</div>
                    </div>
                `;
            }

            updateStats();

            // Через 2 секунды показываем следующий вопрос
            setTimeout(() => {
                let quizType = document.getElementById('quizMode').textContent.includes('ДАТА → СОБЫТИЕ') ? 
                    'date-to-event' : 'event-to-date';
                showQuizQuestion(quizType);
            }, 2500);
        }

        // Инициализация
        updateStats();
    </script>
</body>
</html>
